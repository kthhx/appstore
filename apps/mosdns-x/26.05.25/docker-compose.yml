services:
  mosdns-x:
    image: ghcr.io/787a68/mosdns-x:v26.05.25
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_UDP}:53/udp
      - ${PANEL_APP_PORT_UDP}:53/tcp
      - ${PANEL_APP_PORT_HTTP}:9053
    volumes:
      - ./data:/etc/mosdns
    environment:
      - TZ=${TIME_ZONE}
      - crontabcnd="0 4 * * *"
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
