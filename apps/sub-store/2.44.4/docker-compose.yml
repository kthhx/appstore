services:
  sub-store:
    image: ${SUB_STORE_IMAGE}
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:3001
    volumes:
      - ./data:/opt/app/data
    environment:
      - SUB_STORE_FRONTEND_BACKEND_PATH=${SUB_STORE_FRONTEND_BACKEND_PATH}
      - SUB_STORE_CORS_ALLOWED_ORIGINS=${SUB_STORE_CORS_ALLOWED_ORIGINS}
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
