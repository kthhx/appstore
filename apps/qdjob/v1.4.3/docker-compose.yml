services:
  adminer:
    image: janiquiz/qdjob:v1.4.3
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:33989
    volumes:
      - ./data:/app
    environment:
      - TZ=${TIME_ZONE}
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
