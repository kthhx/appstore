name: Update app version in Renovate Branches

on:
  push:
    branches: [ 'renovate/*' ]
  workflow_dispatch:
    inputs:
      manual-trigger:
        description: 'Manually trigger Renovate'
        default: ''

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  update-app-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure repo
        run: |
          git config --local user.email "githubaction@githubaction.com"
          git config --local user.name "github-action update-app-version"

      - name: Get list of updated files by the last commit in this branch separated by space
        id: updated-files
        run: |
          echo "files=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Run renovate-app-version.sh on updated files
        run: |
          IFS=' ' read -ra files <<< "${{ steps.updated-files.outputs.files }}"

          for file in "${files[@]}"; do
            if [[ $file == *"docker-compose.yml"* || $file == apps/*/*/scripts/init.sh ]]; then
              app_name=$(echo $file | cut -d'/' -f 2)
              old_version=$(echo $file | cut -d'/' -f 3)
              chmod +x .github/workflows/renovate-app-version.sh
              .github/workflows/renovate-app-version.sh $app_name $old_version
            fi
          done

      - name: Commit & Push Changes
        run: |
          IFS=' ' read -ra files <<< "${{ steps.updated-files.outputs.files }}"

          for file in "${files[@]}"; do
            if [[ $file == *"docker-compose.yml"* || $file == apps/*/*/scripts/init.sh ]]; then
              app_name=$(echo $file | cut -d'/' -f 2)
              git add "apps/$app_name/*" && git commit -m "Update app version [skip ci]" --no-verify && git push || true
            fi
          done

  auto-merge:
    name: Auto-merge Renovate PR
    needs: update-app-version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Find the pull request for this branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUBTOKEN || github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Renovate usually creates the pull request seconds after it pushes the
          # branch, so give it a few minutes before giving up.
          deadline=$((SECONDS + 300))
          number=""
          while [[ -z "$number" && $SECONDS -lt $deadline ]]; do
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)
            if [[ -z "$number" ]]; then
              echo "No open pull request for $BRANCH yet; retrying in 15s."
              sleep 15
            fi
          done
          if [[ -z "$number" ]]; then
            echo "No open pull request for $BRANCH; nothing to merge."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for pull request checks
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUBTOKEN || github.token }}
          PR: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Checks created by this workflow run (notably the check for this very
          # job) are part of the pull request's status check rollup. Waiting for
          # them would mean waiting on ourselves until the timeout, so they are
          # filtered out before the checks are evaluated.
          deadline=$((SECONDS + 1200))
          while true; do
            rollup=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup --jq '.statusCheckRollup // []')
            relevant=$(jq --arg rid "$RUN_ID" '[.[] | select((((.detailsUrl // "") | contains("/runs/" + $rid + "/")) | not) and ((.name // .context // "") != "Auto-merge Renovate PR"))]' <<< "$rollup")
            pending=$(jq '[.[] | select((.status // .state // "") as $s | $s == "PENDING" or $s == "IN_PROGRESS" or $s == "QUEUED" or $s == "WAITING")] | length' <<< "$relevant")
            failed=$(jq '[.[] | select((.conclusion // .state // "") as $s | $s == "FAILURE" or $s == "ERROR" or $s == "CANCELLED" or $s == "TIMED_OUT" or $s == "ACTION_REQUIRED" or $s == "STARTUP_FAILURE")] | length' <<< "$relevant")
            echo "pending=$pending failed=$failed"
            if [[ $failed -gt 0 ]]; then
              echo "::error::Pull request #$PR has failing checks; leaving it open for review."
              exit 1
            fi
            if [[ $pending -eq 0 ]]; then
              break
            fi
            if [[ $SECONDS -gt $deadline ]]; then
              echo "::error::Timed out waiting for checks on pull request #$PR; leaving it open for review."
              exit 1
            fi
            sleep 20
          done

      - name: Merge the pull request
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUBTOKEN || github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
            echo "Merged pull request #$PR."
            exit 0
          fi
          echo "Direct merge failed; requesting GitHub auto-merge instead."
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
